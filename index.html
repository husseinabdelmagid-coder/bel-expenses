<meta charset="UTF-8">

<title>BEL Expenses</title>
<style>
:root{
  --bg:#070B14; --card:#0E1526; --card2:#131D33; --line:rgba(255,255,255,.07);
  --ink:#EDF1FA; --mut:#8B95AD; --dim:#5B6478;
  --mint:#34D399; --coral:#FB7185; --amber:#FBBF24; --blue:#60A5FA; --violet:#A78BFA;
  --teal:#2DD4BF; --orange:#FB923C; --pink:#F472B6; --lime:#A3E635;
  --sat: env(safe-area-inset-top,0px); --sab: env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-feature-settings:"tnum" 1; min-height:100%; overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}

/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:40;background:rgba(7,11,20,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding-top:var(--sat)}
.tb-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.brand{font-size:15px;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.brand-dot{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)}
.mnav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.chev{width:30px;height:30px;border-radius:50%;font-size:18px;color:var(--mut);display:flex;align-items:center;justify-content:center}
.chev:active{background:var(--card2);color:var(--ink)}
.mlabel{min-width:86px;text-align:center;font-size:13.5px;font-weight:600}

/* ---------- views ---------- */
main{flex:1;padding:16px 16px calc(96px + var(--sab));}
.view{display:none;animation:fadein .22s ease}
.view.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:22px 4px 10px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.card+.card{margin-top:12px}

/* ---------- hero ring ---------- */
.hero{display:flex;align-items:center;gap:18px}
.ringwrap{position:relative;width:132px;height:132px;flex:none}
.ringwrap svg{transform:rotate(-90deg)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.ring-pct{font-size:26px;font-weight:800;letter-spacing:-.02em}
.ring-sub{font-size:10.5px;color:var(--mut);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hero-stats{flex:1;display:flex;flex-direction:column;gap:10px}
.hstat{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hstat .k{font-size:12px;color:var(--mut);font-weight:600}
.hstat .v{font-size:16px;font-weight:700}
.hstat .v.mint{color:var(--mint)} .hstat .v.coral{color:var(--coral)}
.hero-month{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}

/* ---------- KPI grid ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.kpi .k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.kpi .v{font-size:20px;font-weight:800;letter-spacing:-.02em}
.kpi .s{font-size:11.5px;color:var(--mut);margin-top:3px;font-weight:500}
.v.mint{color:var(--mint)} .v.coral{color:var(--coral)} .v.blue{color:var(--blue)} .v.amber{color:var(--amber)}

/* ---------- pace bar ---------- */
.pace{margin-top:12px}
.pace-track{position:relative;height:8px;border-radius:99px;background:var(--card2);overflow:visible}
.pace-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--mint));transition:width .5s ease}
.pace-fill.over{background:linear-gradient(90deg,var(--orange),var(--coral))}
.pace-today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px;opacity:.85}
.pace-labels{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--mut);font-weight:600}

/* ---------- category rows ---------- */
.catrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:none}
.catic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.catic svg{width:19px;height:19px}
.catmid{flex:1;min-width:0}
.catname{font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.catname .amt{color:var(--mut);font-weight:600;font-size:13px;white-space:nowrap}
.catbar{margin-top:7px;height:6px;border-radius:99px;background:var(--card2);overflow:hidden}
.catfill{height:100%;border-radius:99px;transition:width .5s ease}
.catsub{font-size:11px;color:var(--dim);margin-top:5px;font-weight:600;display:flex;justify-content:space-between}
.catsub .over{color:var(--coral)} .catsub .under{color:var(--mint)}
.steppers{display:flex;align-items:center;gap:8px;flex:none}
.steppers button{width:30px;height:30px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:16px;font-weight:700;color:var(--mut)}
.steppers button:active{background:var(--line);color:var(--ink)}
.stepval{min-width:58px;text-align:center;font-size:13px;font-weight:700}
.editbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.editbtn{font-size:13px;font-weight:700;color:var(--blue);padding:6px 12px;border-radius:99px;background:rgba(96,165,250,.12)}

/* ---------- txns ---------- */
.txn{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.txn:last-child{border-bottom:none}
.txn .t-main{flex:1;min-width:0}
.txn .t-cat{font-size:14px;font-weight:600}
.txn .t-note{font-size:12px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txn .t-amt{font-size:15px;font-weight:700;white-space:nowrap}
.txn .t-del{width:28px;height:28px;border-radius:9px;color:var(--dim);font-size:15px;flex:none}
.txn .t-del:active{color:var(--coral);background:rgba(251,113,133,.12)}
.daygroup{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:16px 4px 4px}
.empty{text-align:center;padding:44px 20px;color:var(--mut)}
.empty .e-ic{width:56px;height:56px;border-radius:18px;background:var(--card2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.empty .e-t{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:5px}
.empty .e-s{font-size:13px;line-height:1.5}

/* ---------- charts ---------- */
.chart-svg{width:100%;display:block}
.legend{display:flex;flex-direction:column;gap:9px;margin-top:14px;min-width:0}
.legrow .lp{flex:none}
.legrow{display:flex;align-items:center;gap:10px;font-size:13px}
.legdot{width:10px;height:10px;border-radius:4px;flex:none}
.legrow .ln{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legrow .lv{font-weight:700}
.legrow .lp{color:var(--dim);font-size:11.5px;width:38px;text-align:right;font-weight:600}
.insight{display:flex;gap:12px;align-items:flex-start}
.insight .i-ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.insight .i-ic svg{width:17px;height:17px}
.insight .i-t{font-size:13.5px;font-weight:700;margin-bottom:2px}
.insight .i-s{font-size:12.5px;color:var(--mut);line-height:1.45}

/* ---------- tab bar ---------- */
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(10,15,28,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tb-row{max-width:480px;margin:0 auto;display:flex;align-items:stretch;justify-content:space-around;height:64px;position:relative}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.04em}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--mint)}
#fab{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--mint));color:#062015;font-size:28px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 8px 24px rgba(52,211,153,.35);border:4px solid var(--bg);flex:none;align-self:flex-start}
#fab:active{transform:scale(.94)}

/* ---------- add sheet ---------- */
#veil{position:fixed;inset:0;background:rgba(2,4,10,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
#veil.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;max-width:480px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.32,.72,0,1);padding:10px 18px calc(16px + var(--sab));max-height:92vh;overflow-y:auto}
#sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:99px;background:var(--card2);margin:4px auto 12px}
.sh-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sh-title h2{font-size:17px;font-weight:800}
.sh-close{width:32px;height:32px;border-radius:50%;background:var(--card2);color:var(--mut);font-size:15px}
.amtdisp{text-align:center;padding:6px 0 2px;font-size:36px;font-weight:800;letter-spacing:-.03em}
.amtdisp .cur{font-size:22px;color:var(--mut);font-weight:700;margin-right:2px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0;max-height:172px;overflow-y:auto}
.cchip{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:14px;background:var(--card2);border:1.5px solid transparent;font-size:10px;font-weight:700;color:var(--mut);letter-spacing:.01em}
.cchip .catic{width:30px;height:30px;border-radius:10px}
.cchip.sel{border-color:var(--mint);color:var(--ink);background:rgba(52,211,153,.1)}
.drow{display:flex;gap:8px;margin:4px 0 10px}
.dchip{flex:1;text-align:center;padding:9px 4px;border-radius:12px;background:var(--card2);font-size:12.5px;font-weight:700;color:var(--mut)}
.dchip.sel{background:rgba(96,165,250,.15);color:var(--blue)}
.dchip input{background:none;border:none;color:inherit;font:inherit;text-align:center;width:100%;outline:none;font-weight:700}
.notein{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;color:var(--ink);outline:none;margin-bottom:12px}
.notein::placeholder{color:var(--dim)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:46px;border-radius:14px;background:var(--card2);font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center}
.key:active{background:var(--line)}
.savebtn{width:100%;margin-top:12px;padding:16px;border-radius:16px;background:linear-gradient(135deg,var(--teal),var(--mint));color:#062015;font-size:16px;font-weight:800;letter-spacing:.01em}
.savebtn:disabled{opacity:.35}
.savebtn:active:not(:disabled){transform:scale(.98)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(88px + var(--sab));transform:translate(-50%,20px);background:var(--ink);color:#0A0E1A;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.32,.72,0,1);z-index:90;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hintbar{margin-top:12px;font-size:11.5px;color:var(--dim);text-align:center;font-weight:600}

/* ---------- savings ---------- */
.sav-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sav-bal{font-size:30px;font-weight:800;letter-spacing:-.02em}
.sav-sub{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:3px}
.sav-delta{font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:99px;white-space:nowrap;margin-top:4px}
.sav-delta.up{color:var(--mint);background:rgba(52,211,153,.12)}
.sav-delta.down{color:var(--coral);background:rgba(251,113,133,.12)}
.sav-actions{display:flex;gap:10px;margin-top:14px}
.savbtn{flex:1;padding:12px;border-radius:14px;font-size:13.5px;font-weight:800}
.savbtn.mint{background:linear-gradient(135deg,var(--teal),var(--mint));color:#062015}
.savbtn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.sav-note{margin-top:12px;font-size:11.5px;color:var(--dim);font-weight:600}
.sav-note button{color:var(--blue);font-weight:700;font-size:11.5px}
.sav-list{margin-top:6px}
.nudge{margin-top:12px;border-color:rgba(52,211,153,.28)}
.nudge.pending{border-color:rgba(251,191,36,.34)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="app">
  <header id="topbar">
    <div class="tb-inner">
      <div class="brand"><span class="brand-dot"></span>BEL&nbsp;Expenses</div>
      <div class="mnav">
        <button class="chev" id="mPrev" aria-label="Previous month">&#8249;</button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/></svg>

<script>
'use strict';

/* ---- storage capability probe: sandboxed previews block storage entirely ---- */
let STORAGE_BLOCKED = false;
try{
  const _pk='belx.probe';
  localStorage.setItem(_pk,'1');
  STORAGE_BLOCKED = (localStorage.getItem(_pk)!=='1');
  localStorage.removeItem(_pk);
}catch(e){ STORAGE_BLOCKED = true; }
const LS_EXPCNT='belx.expcnt';
let lastExportCount = 0;
try{ lastExportCount = Number(localStorage.getItem(LS_EXPCNT)||0)||0; }catch(e){}

/* ---------------- automatic backup engine ----------------
   - rolling snapshots in localStorage (last 5) + IndexedDB (last 20)
   - tombstones so a restore never resurrects deleted entries
   - boot merges EVERY layer, so a partial wipe self-heals
   - optional auto-copy of the data-embedded file                        */
const LS_RING='belx.ring.v1', LS_AUTO='belx.auto.v1', LS_AUTOAT='belx.autoat.v1';
const RING_MIN_MS=45000;
let delIds=[], delSav=[];
let ring=[];
let lastRingTs=0, lastAutoAt=0;
let autoCopy=false;
try{ autoCopy = localStorage.getItem(LS_AUTO)==='1'; }catch(e){}
try{ lastAutoAt = Number(localStorage.getItem(LS_AUTOAT)||0)||0; }catch(e){}

function pushRing(snapStr){
  const now=Date.now();
  if (now-lastRingTs < RING_MIN_MS && ring.length) return;
  lastRingTs=now;
  try{ ring.push(JSON.parse(snapStr)); }catch(e){ return; }
  if (ring.length>20) ring=ring.slice(-20);
  try{ localStorage.setItem(LS_RING, JSON.stringify(ring.slice(-5))); }catch(e){}
  idbPutRing(ring).catch(()=>{});
}
function idbPutRing(v){ return idb().then(db=> new Promise((res,rej)=>{
  const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,'ring');
  t.oncomplete=()=>res(); t.onerror=()=>rej(t.error);
}));}
function idbGetRing(){ return idb().then(db=> new Promise((res,rej)=>{
  const q=db.transaction('kv','readonly').objectStore('kv').get('ring');
  q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
}));}

/* union-merge every snapshot found; newest wins for settings, entries are unioned */
function mergeSnaps(list){
  const valid=(list||[]).filter(s=>s&&typeof s==='object'&&Array.isArray(s.txns));
  if(!valid.length) return null;
  valid.sort((a,b)=>(a.ts||0)-(b.ts||0));
  const newest=valid[valid.length-1];
  const tMap=new Map(), sMap=new Map(), dead=new Set(), sdead=new Set();
  for(const s of valid){
    for(const t of (s.txns||[])) if(t&&t.id!=null) tMap.set(t.id,t);
    for(const t of (s.sav||[])) if(t&&t.id!=null) sMap.set(t.id,t);
    for(const id of (s.del||[])) dead.add(id);
    for(const id of (s.sdel||[])) sdead.add(id);
  }
  for(const id of dead) tMap.delete(id);
  for(const id of sdead) sMap.delete(id);
  const out=Object.assign({},newest);
  out.txns=[...tMap.values()].sort((a,b)=>String(a.d||'').localeCompare(String(b.d||''))||a.id-b.id);
  out.sav=[...sMap.values()];
  out.del=[...dead]; out.sdel=[...sdead];
  out.ts=Math.max(...valid.map(s=>s.ts||0));
  return out;
}
function gatherSnaps(){
  const out=[];
  try{ const s=JSON.parse(localStorage.getItem(LS_ALL)||'null'); if(s) out.push(s); }catch(e){}
  try{ const r=JSON.parse(localStorage.getItem(LS_RING)||'[]'); if(Array.isArray(r)) out.push(...r); }catch(e){}
  try{ if(window.__BELX_RESTORE__) out.push(window.__BELX_RESTORE__); }catch(e){}
  return out;
}
function asSnapList(rg){
  if (!rg) return [];
  if (Array.isArray(rg)) return rg;
  try { const p = JSON.parse(rg); return Array.isArray(p) ? p : (p ? [p] : []); } catch(e){ return []; }
}
function restoreAll(silent){
  const apply=(extra)=>{ const m=mergeSnaps(extra); if(m){ applySnapshot(m); persist(); renderCurrent(); }
    if(!silent) toast('Restored '+txns.length+' expense'+(txns.length===1?'':'s')+' and '+savEntries.length+' saving entr'+(savEntries.length===1?'y':'ies'));
  };
  Promise.all([
    idbGet().catch(()=>null),
    idbGetRing().catch(()=>null),
    readCacheSnap()
  ]).then(([main, rg, cached])=>{

function maybeAutoCopy(){
  if(!autoCopy) return;

  try{ localStorage.setItem(LS_AUTOAT,String(now)); }catch(e){}
  try{ exportAppWithData(true); }catch(e){}
}

/* ================= STATE & DURABLE STORE =================
   Several copies, so one failure is less likely to drop entries:
     1. IndexedDB
     2. localStorage
     3. Cache Storage snapshot, read back on the next launch
     4. Backup file or an exported app copy (the copy that leaves the phone)
   The service worker caches this shell for Home Screen and offline use.
   Backup now is still the file to keep in Files or iCloud. */
const LS_ALL='belx.all.v4', LS_BK='belx.bk.v1';
const LS_TXN='belx.txns.v1', LS_BUD='belx.bud.v1', LS_INC='belx.inc.v1',
      LS_HID='belx.hid.v2', LS_NEW='belx.newcat.v1', LS_SAV='belx.sav.v1', LS_ING='belx.ing.v1';
let txns = [], budOv = {}, incOv = {}, hiddenCats = {}, newCats = {}, savEntries = [], ingOv = {};
let lastTs = 0, lastSavedAt = 0, lastBackupAt = 0, storeOk = true, _db = null, _dbFail = false;
try{ lastBackupAt = Number(localStorage.getItem(LS_BK)||0)||0; }catch(e){}

function applySnapshot(s){
  if (!s || typeof s!=='object') return false;
  delIds = Array.isArray(s.del) ? s.del.slice() : [];
  delSav = Array.isArray(s.sdel) ? s.sdel.slice() : [];
  txns = Array.isArray(s.txns) ? s.txns : [];
  budOv = (s.bud && typeof s.bud==='object') ? s.bud : {};
  incOv = (s.inc && typeof s.inc==='object') ? s.inc : {};
  hiddenCats = (s.hid && typeof s.hid==='object') ? s.hid : {};
  newCats = (s.newcat && typeof s.newcat==='object') ? s.newcat : {};
  savEntries = Array.isArray(s.sav) ? s.sav : [];
  ingOv = (s.ing && typeof s.ing==='object') ? s.ing : {};
  for (const n in newCats){ CATMETA[n]=newCats[n]; if(!CATORDER.includes(n)) CATORDER.splice(CATORDER.length-1,0,n); }
  lastTs = s.ts||0;
  return true;
}
function snapshot(){ return {v:5, ts:Date.now(), txns, bud:budOv, inc:incOv, hid:hiddenCats, newcat:newCats, sav:savEntries, ing:ingOv, del:delIds, sdel:delSav}; }

/* one-time migration from the old separate keys */
(function migrateLegacy(){
  try{
    if (localStorage.getItem(LS_ALL)) return;
    const t = JSON.parse(localStorage.getItem(LS_TXN)||'null');
    if (!t) return;
    applySnapshot({ts:1, txns:t,
      bud:JSON.parse(localStorage.getItem(LS_BUD)||'{}'),
      inc:JSON.parse(localStorage.getItem(LS_INC)||'{}'),
      hid:JSON.parse(localStorage.getItem(LS_HID)||'{}'),
      newcat:JSON.parse(localStorage.getItem(LS_NEW)||'{}'),
      sav:JSON.parse(localStorage.getItem(LS_SAV)||'[]'),
      ing:JSON.parse(localStorage.getItem(LS_ING)||'{}')});
  }catch(e){}
})();

function idb(){ return new Promise((res,rej)=>{
  if (_db) return res(_db);
  if (_dbFail) return rej(new Error('no idb'));
  try{
    const r = indexedDB.open('belx',1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('kv');
    r.onsuccess = ()=>{ _db = r.result; res(_db); };
    r.onerror = ()=>{ _dbFail = true; rej(r.error); };
  }catch(e){ _dbFail = true; rej(e); }
});}
function idbPut(v){ return idb().then(db=> new Promise((res,rej)=>{
  const t = db.transaction('kv','readwrite'); t.objectStore('kv').put(v,'state');
  t.oncomplete = ()=>res(); t.onerror = ()=>rej(t.error);
})); }
function idbGet(){ return idb().then(db=> new Promise((res,rej)=>{
  const q = db.transaction('kv','readonly').objectStore('kv').get('state');
  q.onsuccess = ()=>res(q.result); q.onerror = ()=>rej(q.error);
})); }

/* write every layer */
function cacheSnapshot(s){
  if (!('caches' in window)) return;
  const url = new URL('./__belx_state__.json', location.href).toString();
  caches.open('belx-data-v1').then(c => c.put(url, new Response(s, {headers:{'Content-Type':'application/json'}}))).catch(()=>{});
}
function readCacheSnap(){
  if (!('caches' in window)) return Promise.resolve(null);
  const url = new URL('./__belx_state__.json', location.href).toString();
  return caches.open('belx-data-v1').then(c => c.match(url)).then(r => r ? r.text() : null).catch(()=>null);
}
function persist(){
  const s = JSON.stringify(snapshot());
  let lsOk = false;
  try{ localStorage.setItem(LS_ALL, s); lsOk = true; }catch(e){ lsOk = false; }
  if (!lsOk && _dbFail) storeOk = false;
  idbPut(s).catch(()=>{});
  cacheSnapshot(s);
  pushRing(s);
  lastSavedAt = Date.now();
}

/* Seed monthly income: derived from the Excel (income = total expenses + saving) */
const incSeed = {};
{ let last = null;
  for (const m of SEED.months){
    if (m.savF!=null) last = Math.round(m.totalF + m.savF);
    if (m.savA!=null) last = Math.round(m.items ? Object.values(m.items).reduce((a,b)=>a+(b.a||0),0) + m.savA : last);

}

function saveSav(){ persist(); }

function monthSavSum(k){ return savEntries.reduce((a,t)=> t.d.slice(0,7)===k ? a+t.amt : a, 0); }
/* Savings balance: seed ING value, overridden per month, plus logged saving entries; carries forward */
function balanceOf(k){
  let bal = 0, kk = SEED.months[0].k, guard = 0;
  while (guard++ < 600){
    if (ingOv[kk]!=null) bal = ingOv[kk];
    else { const m = SEED.months.find(x=>x.k===kk); if (m && m.ing!=null) bal = m.ing; }
    bal += monthSavSum(kk);
    if (kk>=k) break;
    kk = shiftKey(kk,1);
  }
  return bal;
}

const NOW = new Date();
function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
const REALCUR = keyOf(NOW);

const MNAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MFULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function labelOf(k){ const [y,m]=k.split('-').map(Number); return MNAMES[m-1]+' '+y; }
function fullLabelOf(k){ const [y,m]=k.split('-').map(Number); return MFULL[m-1]+' '+y; }
function shiftKey(k, d){ let [y,m]=k.split('-').map(Number); m+=d; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+'-'+String(m).padStart(2,'0'); }
function daysIn(k){ const [y,m]=k.split('-').map(Number); return new Date(y,m,0).getDate(); }

function fmt(n){ return '€'+Math.round(n).toLocaleString('en-US'); }
function fmtS(n){ return (n<0?'−€':'€')+Math.abs(Math.round(n)).toLocaleString('en-US'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Month data: seed + overrides + user txns */
function monthData(k){
  let m = SEED.months.find(x=>x.k===k);
  let items = {}, totalF = 0, savF = null, ing = null, savA = null, dyn=false;
  if (m){
    for (const cat in m.items) items[cat] = {a:m.items[cat].a||0, f:m.items[cat].f||0};
    totalF = m.totalF; savF = m.savF; ing = m.ing; savA = m.savA;
  } else {
    dyn = true;
    for (const cat in SEED.provision) items[cat] = {a:0, f:SEED.provision[cat]};
    totalF = Object.values(SEED.provision).reduce((a,b)=>a+b,0);
    savF = SEED.provSavingF;
  }
  // budget overrides — iterating the overrides themselves, so a category added
  // to this month's budget gets created in items even if the Excel never had it
  const budPfx = k+'|';
  const explicit = {};
  for (const bk in budOv){
    if (bk.indexOf(budPfx)!==0) continue;
    const bcat = bk.slice(budPfx.length);
    if (!items[bcat]) items[bcat] = {a:0, f:0};
    if (budOv[bk]!=null) items[bcat].f = budOv[bk];
    explicit[bcat] = true;   // added on purpose -> always list it, even at €0
  }
  for (const cat of (hiddenCats[k]||[])) delete explicit[cat];
  // removed items drop out of the budget (and its total) entirely
  const hidM = hiddenCats[k]||[];
  for (const cat of hidM) delete items[cat];
  totalF = Object.values(items).reduce((a,b)=>a+(b.f||0),0);
  // user transactions
  let extra = 0;
  for (const t of txns){
    if (t.d.slice(0,7)!==k) continue;
    if (!items[t.cat]) items[t.cat] = {a:0, f:(SEED.provision[t.cat]||0)};
    items[t.cat].a += t.amt; extra += t.amt;
  }
  let totalA = Object.values(items).reduce((a,b)=>a+(b.a||0),0);
  // income baseline: per-month value wins; otherwise the latest known income carries forward
  let income = null;
  if (incOv[k]!=null) income = incOv[k];
  else { let kk=k, g=0; while(g++<600){ if (incSeed[kk]!=null){ income=incSeed[kk]; break; } if (kk<=SEED.months[0].k) break; kk=shiftKey(kk,-1); } }
  if (income!=null){
    savF = income - totalF;   // planned saving = income − total budget
    savA = income - totalA;   // actual saving  = income − actual spent (incl. app entries)
  } else if (savA!=null) savA = savA - extra;
  return {k, label:labelOf(k), items, totalA, totalF, savA, savF, income, explicit, ing: balanceOf(k), dyn};
}
function monthCats(md){
  const set = Object.keys(md.items).filter(c=>(md.items[c].a||0)>0 || (md.items[c].f||0)>0 || (md.explicit && md.explicit[c]));
  return set.sort((a,b)=>{
    const ia = CATORDER.indexOf(a), ib = CATORDER.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
}
function paceFrac(k){
  if (k===REALCUR) return NOW.getDate()/daysIn(k);
  return k<REALCUR ? 1 : 0;
}

/* ================= RENDER: ACTIVITY ================= */
function dayLabel(ds){
  const t = keyOf(NOW)+'-'+String(NOW.getDate()).padStart(2,'0');
  const yd = new Date(NOW); yd.setDate(yd.getDate()-1);
  const y = keyOf(yd)+'-'+String(yd.getDate()).padStart(2,'0');
  if (ds===t) return 'Today';
  if (ds===y) return 'Yesterday';
  const [yy,mm,dd] = ds.split('-').map(Number);
  return dd+' '+MNAMES[mm-1]+' '+yy;
}

/* ================= CHART HELPERS ================= */
function barChart(rows){ // rows: {label, a, f}
  const W=340,H=170,padL=8,padB=22,padT=14;
  const n = rows.length; if(!n) return '';
  const maxV = Math.max(...rows.map(r=>Math.max(r.a,r.f)),1)*1.12;
  const slot = (W-padL*2)/n, bw = Math.min(slot*0.5, 22);
  const y = v => padT + (H-padB-padT)*(1 - v/maxV);
  let s = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}">`;
  for (let i=0;i<n;i++){
    const r = rows[i], x = padL + slot*i + slot/2;
    if (r.f>0){
      const fy = y(r.f);
      s += `<line x1="${x-bw/1.4}" y1="${fy}" x2="${x+bw/1.4}" y2="${fy}" stroke="var(--dim)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 3"/>`;
    }
    const by = y(r.a), bh = H-padB-by;
    const over = r.f>0 && r.a>r.f;
    s += `<rect x="${x-bw/2}" y="${by}" width="${bw}" height="${Math.max(bh, r.a>0?2:0)}" rx="4" fill="${r.cur?'var(--mint)':(over?'var(--coral)':'var(--card2)')}" ${(!r.cur&&!over)?'stroke="rgba(255,255,255,.14)"':''}/>`;
    if (i%Math.ceil(n/8)===0 || i===n-1)
      s += `<text x="${x}" y="${H-6}" text-anchor="middle" font-size="9.5" fill="var(--dim)" font-weight="600">${r.label}</text>`;
  }
  s += `<line x1="${padL}" y1="${H-padB}" x2="${W-padL}" y2="${H-padB}" stroke="var(--line)"/>`;
  s += '</svg>';
  return s;
}
function lineChart(rows){ // rows: {label, v}
  const data = rows.filter(r=>r.v!=null);
  const W=340,H=130,padL=8,padR=8,padB=20,padT=12;
  if (data.length<2) return '<div class="empty" style="padding:20px"><div class="e-s">Not enough data yet</div></div>';
  const minV = Math.min(...data.map(r=>r.v)), maxV = Math.max(...data.map(r=>r.v));
  const span = Math.max(maxV-minV,1);
  const x = i => padL + (W-padL-padR)*(i/(data.length-1));
  const y = v => padT + (H-padB-padT)*(1-(v-minV)/span*0.9);
  let pts = data.map((r,i)=>x(i).toFixed(1)+','+y(r.v).toFixed(1)).join(' ');
  let s = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}">`;
  s += `<polyline points="${pts}" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  data.forEach((r,i)=>{
    s += `<circle cx="${x(i)}" cy="${y(r.v)}" r="3" fill="var(--amber)"/>`;
    if (i%Math.ceil(data.length/6)===0 || i===data.length-1)
      s += `<text x="${x(i)}" y="${H-5}" text-anchor="middle" font-size="9.5" fill="var(--dim)" font-weight="600">${r.label}</text>`;
  });
  s += `<text x="${padL}" y="${padT}" font-size="9.5" fill="var(--dim)" font-weight="700">${fmt(maxV)}</text>`;
  s += `<text x="${padL}" y="${H-padB+2}" font-size="9.5" fill="var(--dim)" font-weight="700">${fmt(minV)}</text>`;
  s += '</svg>';
  return s;
}
function donut(parts){ // parts: {label, v, color}
  const total = parts.reduce((a,p)=>a+p.v,0);
  const R=54, CIRC=2*Math.PI*R;
  let off = 0, s = `<svg width="120" height="120" viewBox="0 0 120 120" style="transform:rotate(-90deg)">`;
  s += `<circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--card2)" stroke-width="15"/>`;
  for (const p of parts){
    if (p.v<=0) continue;
    const frac = p.v/total;
    s += `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${p.color}" stroke-width="15"
      stroke-dasharray="${(frac*CIRC).toFixed(2)} ${CIRC.toFixed(2)}" stroke-dashoffset="${(-off*CIRC).toFixed(2)}"/>`;
    off += frac;
  }
  s += '</svg>';
  return s;
}

}

    else {
      if (shAmt.includes('.') && shAmt.split('.')[1].length>=2) return;
      if (shAmt==='0') shAmt = k; else if (shAmt.replace('.','').length<7) shAmt += k;

      saveTxns(); closeSheet();

    if (mk && mk!==curKey){ curKey = mk; }

    const gone = editingTxn;
    txns = txns.filter(x=>x.id!==id);
    delIds.push(id);
    saveTxns(); closeSheet(); editingTxn = null;
    toast('Deleted '+fmt(gone.amt)+' · '+cmeta(gone.cat).s);
    renderCurrent();
  });
}

  document.getElementById('sheet').classList.remove('open');

function keypadKeys(attr){ return ['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button class="key" data-${attr}="${k}">${k}</button>`).join(''); }
function wireKeypad(attr, get, set, display, saveBtn){
  document.querySelectorAll('[data-'+attr+']').forEach(b=> b.addEventListener('click', ()=>{
    const k = b.getAttribute('data-'+attr);
    let v = get();
    if (k==='⌫'){ v = v.length>1 ? v.slice(0,-1) : '0'; }
    else if (k==='.'){ if (!v.includes('.')) v += '.'; }
    else {
      if (v.includes('.') && v.split('.')[1].length>=2) return;
      if (v==='0') v = k; else if (v.replace('.','').length<9) v += k;
    }
    set(v);
    document.getElementById(display).textContent = v;
    if (saveBtn) document.getElementById(saveBtn).disabled = !(parseFloat(v)>0);
  }));
}

/* ================= DATA & BACKUP ================= */
function download(filename, text, type){
  try{
    const b = new Blob([text], {type: type||'application/json'});
    const u = URL.createObjectURL(b);
    const a = document.createElement('a'); a.href = u; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 2000);
  }catch(e){ toast('Could not create the file on this device'); }
}
function markBackedUp(){
  lastBackupAt = Date.now();
  lastExportCount = recordCount();
  try{ localStorage.setItem(LS_BK, String(lastBackupAt)); localStorage.setItem(LS_EXPCNT, String(lastExportCount)); }catch(e){}
}
function backupNow(){
  download('bel-expenses-backup-'+new Date().toISOString().slice(0,10)+'.json',
           JSON.stringify(snapshot(), null, 1), 'application/json');
  markBackedUp();
  toast('Backup saved — keep it in Files or iCloud');
}
function exportAppWithData(silent){
  let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const inject = '<script>window.__BELX_RESTORE__='+JSON.stringify(snapshot())+';<\/script>';
  html = html.replace('</head>', inject+'</head>');
  download('bel-expenses-with-data.html', html, 'text/html');
  markBackedUp();
  if(!silent) toast('App copy saved with your data inside');
}
function restoreFromFile(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const o = JSON.parse(String(r.result));
      if (!applySnapshot(o)) throw new Error('bad');
      persist(); renderCurrent();
      toast('Backup restored — everything is back');
    }catch(e){ toast('That file is not a valid backup'); }
  };
  r.onerror = ()=> toast('Could not read that file');
  r.readAsText(file);
}

    el.style.cssText = 'margin-bottom:12px';
    el.innerHTML = `<div class="insight">
      <span class="i-ic" style="background:rgba(52,211,153,.14)"><svg viewBox="0 0 24 24" fill="none" stroke="var(--mint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 19 6.2v5.2c0 4.4-3 7.6-7 8.8-4-1.2-7-4.4-7-8.8V6.2L12 3.5z"/></svg></span>
      <div><div class="i-t">This preview cannot store entries</div>
      <div class="i-s">Open BEL Expenses in Safari, or from your Home Screen, so spending you log stays on the phone.</div></div></div>`;
  } else {
    el.className = 'card nudge pending';
    el.style.cssText = 'margin-bottom:12px';
    el.innerHTML = `<div class="insight">
      <span class="i-ic" style="background:rgba(251,191,36,.14)"><svg viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="m8 10 4 4 4-4"/><path d="M5 20h14"/></svg></span>
      <div><div class="i-t">${pending} update${pending===1?'':'s'} since your last backup</div>
      <div class="i-s">Your entries are still on this phone. Backup now saves a file you can keep in Files or iCloud.</div>
      <button class="savbtn mint" id="saveNowBtn" style="margin-top:10px">Backup now</button></div></div>`;
    el.querySelector('#saveNowBtn').addEventListener('click', ()=>{ backupNow(); renderCurrent(); });
  }
}

/* ================= SHELL ================= */
let toastT = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2200);
}
function renderCurrent(){
  document.getElementById('mLabel').textContent = labelOf(curKey);
  ({dash:renderDash, budget:renderBudget, activity:renderActivity, trends:renderTrends})[curView]();
  updateStorageBanner();
}
function setView(v){
  curView = v;
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active', x.id==='view-'+v));
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.getAttribute('data-view')===v));
  renderCurrent();
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(b=> b.addEventListener('click', ()=> setView(b.getAttribute('data-view'))));
document.getElementById('fab').addEventListener('click', openSheet);
document.getElementById('gear').addEventListener('click', openDataSheet);
document.getElementById('veil').addEventListener('click', closeSheet);
document.getElementById('mPrev').addEventListener('click', ()=>{ curKey = shiftKey(curKey,-1); renderCurrent(); });
document.getElementById('mNext').addEventListener('click', ()=>{ curKey = shiftKey(curKey,1); renderCurrent(); });

/* ---- boot: restore data across every layer ---- */
try{ const s=JSON.parse(localStorage.getItem(LS_ALL)||'null'); if(s) applySnapshot(s); }catch(e){}
try{ if (window.__BELX_RESTORE__){ const s=window.__BELX_RESTORE__; if((s.ts||0)>lastTs) applySnapshot(s); } }catch(e){}

setView('dash');

/* IndexedDB, the snapshot ring, and Cache Storage — union, newest settings win */
Promise.all([
  idbGet().catch(()=>null),
  idbGetRing().catch(()=>null),
  readCacheSnap()
]).then(([main, rg, cached])=>{
  const srcs=gatherSnaps();
  try{ if(main) srcs.push(JSON.parse(main)); }catch(e){}
  for (const s of asSnapList(rg)) srcs.push(s);
  try{ if(cached) srcs.push(JSON.parse(cached)); }catch(e){}
  srcs.push(snapshot());
  const m=mergeSnaps(srcs);
  if(m){ applySnapshot(m); renderCurrent(); }
}).catch(()=>{
  const m=mergeSnaps(gatherSnaps()); if(m){ applySnapshot(m); renderCurrent(); }
});
/* ask the browser to keep this origin's storage */
try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
/* snapshot on hide/close, and auto-copy when that option is on */
try{
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ persist(); maybeAutoCopy(); } });
  window.addEventListener('pagehide', ()=>{ persist(); maybeAutoCopy(); });
  setTimeout(()=>{ maybeAutoCopy(); }, 6000);
}catch(e){}
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register(new URL('sw.js', location.href)).catch(function(){});
  });
}
</script>
